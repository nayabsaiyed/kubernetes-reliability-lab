name: Validate and rehearse recovery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: HTTP, evidence and manifest contract checks
        run: python -m unittest discover -s tests -v
  integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install checksum-verified upstream tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lab-bin"
          cd "$RUNNER_TEMP/lab-bin"
          curl --fail --silent --show-error --location --retry 3 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 -o kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo '629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  kubectl' | sha256sum --check
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/lab-bin" >> "$GITHUB_PATH"
      - name: Healthy release, blocked candidate, explicit rollback
        run: python scripts/lab.py
      - name: Upload diagnostics without cluster credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .lab/runs/*/summary.json
            .lab/runs/*/commands.log
            .lab/runs/*/baseline.json
            .lab/runs/*/stalled.json
            .lab/runs/*/recovered.json
